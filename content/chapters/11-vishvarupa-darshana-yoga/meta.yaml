number: 11
slug: 11-vishvarupa-darshana-yoga
name: The Yoga of the Cosmic Vision
sanskrit_name: विश्वरूपदर्शनयोग
transliterated_name: Vishvarūpa Darshana Yoga
verse_count: 55
folk_art_style: madhubani
summary: >
  This is the most spectacular chapter! Arjuna asks to see Krishna's true
  form, and Krishna gives him special eyes to see it. Arjuna sees the entire
  universe — all the stars, all living beings, past and future — inside
  Krishna's body. It's so amazing and overwhelming that Arjuna trembles
  with wonder and asks Krishna to return to his gentle, familiar form.
status: active
cover_brief: >
  Krishna's cosmic form fills the centre, far larger than anything else: one blue-skinned body with
  many arms and several crowned faces, holding conch, discus, mace, lotus, sword and bow, and inside
  his vast chest and robe are the sun, the moon, stars, mountains, rivers, Brahma seated on a lotus,
  rishis with matted hair buns and beards, elephants and marching armies. At the lower right, Arjuna
  (brown skin, black moustache, terracotta armour, plain headband, no halo, Gandiva lowered) kneels
  trembling with folded hands, looking up in wonder. Madhubani double-line outlines, fish and lotus
  fills, cross-hatching and a dense lotus-and-fish border on a patterned cream ground. Exclude: winged
  angels, cherubs, fairies or any figure with bird wings, figures riding clouds, Buddha figures or
  shaven monks, a halo on Arjuna, a second small Krishna, stray marks or glyphs in the sky; no text,
  letters, numbers or script.
