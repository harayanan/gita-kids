chapter: 2
verse: 21
speaker: krishna

sanskrit: "वेदाविनाशिनं नित्यं य एनमजमव्ययम्। कथं स पुरुषः पार्थ कं घातयति हन्ति कम्॥"

transliteration: "vedāvināśinaṁ nityaṁ ya enamajamavyayam | kathaṁ sa puruṣaḥ pārtha kaṁ ghātayati hanti kam ||"

