slug: 02-sankhya-yoga
name: The Yoga of Wisdom
sanskrit_name: सांख्ययोग
transliterated_name: Sānkhya Yoga
verse_count: 72
folk_art_style: gond
summary: >
  Arjuna is still sad and confused, so Krishna begins to teach him. Krishna
  explains that the soul never dies — it simply moves from one body to another,
  like changing old clothes for new ones. He tells Arjuna to do his duty without
  worrying about winning or losing. This is the chapter where Krishna's great
  teaching truly begins.
status: active
cover_brief: >
  At the centre, under a large banyan tree beside a river, a man drapes a worn, torn old dhoti over a
  low branch while wrapping himself in a bright new patterned dhoti, the clearest image in the
  picture. Krishna (largest figure, one Krishna only, exactly two arms, both hands holding a flute to
  his lips as he plays, no other hands, blue skin, yellow silk, peacock-feather crown, halo) stands at
  the left facing the man; Arjuna (appears once only, brown skin, black moustache, terracotta armour,
  plain headband) stands at the right, lifting his Gandiva bow from the ground with a steady face.
  Deer, peacocks, birds and fish in the river frame the scene; Krishna's robes, Arjuna's armour, the
  man, both garments, the tree trunk, leaves and every animal are filled with bold Gond dot-and-dash
  patterning, on a cream ground inside a leaf-and-vine border. Exclude: raised palms or pointing hands
  on Krishna, any third hand, clothes hangers, pegs or rails, infinity signs, arrows, loops, circles
  linking figures, medallions, ghostly or transparent figures, a second Krishna or Arjuna; no text,
  letters, numbers or script.
