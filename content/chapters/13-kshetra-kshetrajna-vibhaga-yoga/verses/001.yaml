chapter: 13
verse: 1
speaker: arjuna

sanskrit: "प्रकृतिं पुरुषं चैव क्षेत्रं क्षेत्रज्ञमेव च। एतद्वेदितुमिच्छामि ज्ञानं ज्ञेयं च केशव॥"

transliteration: "prakṛtiṁ puruṣaṁ caiva kṣetraṁ kṣetrajñameva ca | etadveditumicchāmi jñānaṁ jñeyaṁ ca keśava ||"

