chapter: 9
verse: 12
speaker: krishna

sanskrit: "मोघाशा मोघकर्माणो मोघज्ञाना विचेतसः। राक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः॥"

transliteration: "moghāśā moghakarmāṇo moghajñānā vicetasaḥ | rākṣasīmāsurīṁ caiva prakṛtiṁ mohinīṁ śritāḥ ||"

dhatu_breakdown:
  - word: "मोघाशाः"
    parts: ["mogha (vain, empty)", "āśā (hope, wish)"]
    meaning: "of vain, empty hopes"
  - word: "मोघकर्माणः"
    parts: ["mogha (vain, empty)", "kṛ (to do, to act)"]
    meaning: "of vain, fruitless deeds"
  - word: "मोघज्ञानाः"
    parts: ["mogha (vain, empty)", "jñā (to know)"]
    meaning: "of vain, empty knowledge"
  - word: "विचेतसः"
    parts: ["vi (apart, away)", "cit (to think, to be aware)"]
    meaning: "scattered in mind, senseless"
  - word: "राक्षसीम्"
    parts: ["rakṣas (a fierce, harmful spirit)"]
    meaning: "fierce and harmful, like a rakshasa"
  - word: "आसुरीम्"
    parts: ["asura (a demon, an enemy of the gods)"]
    meaning: "demonic"
  - word: "च"
    parts: ["ca (and)"]
    meaning: "and"
  - word: "एव"
    parts: ["eva (indeed, only)"]
    meaning: "indeed"
  - word: "प्रकृतिम्"
    parts: ["pra (forth)", "kṛ (to make)"]
    meaning: "nature, the way of being"
  - word: "मोहिनीम्"
    parts: ["muh (to confuse, to delude)"]
    meaning: "deluding, bewildering"
  - word: "श्रिताः"
    parts: ["śri (to resort to, to cling to)"]
    meaning: "having clung to, having taken on"

meaning: >
  Krishna says: "Those who miss My true nature end up with empty hopes, empty
  deeds, and empty knowledge. Their minds are scattered, and they slip into a
  fierce, demon-like way of being that only confuses them more." When people
  chase hollow things and ignore what is real, all their wishing and working and
  knowing comes to nothing, like building castles out of sand at the edge of the
  tide.

story:
  title: "The Treasure That Turned to Sand"
  source: "original"
  body: |
    There was once a proud chieftain named Vajraketu who scoffed at the sages
    and laughed at the gods. "Hopes and prayers are for weaklings," he said. "I
    trust only my own strong arm and my clever mind."

    He had heard a rumour of a buried treasure in the dry hills beyond his
    fort — chests of gold guarded, the old stories said, by nothing but a
    riddle carved in stone. The riddle read: *What you grasp with a greedy
    heart turns to dust; what you receive with an open one turns to gold.*

    Vajraketu sneered at the carving. "Silly words," he said, and set his men to
    digging.

    They dug for days under the burning sun. His hopes grew wild — he pictured
    crowns, palaces, armies bought with gold. At last their spades struck a
    great iron chest. Vajraketu shoved his men aside and threw back the lid with
    his own hands.

    Inside, gold coins gleamed up at him, more than he had ever dreamed.

    Laughing, he plunged both fists in and snatched up two great handfuls. But
    the moment his greedy fingers closed, the coins crumbled — they ran through
    his fingers as plain grey sand and pattered to the ground.

    He grabbed again. Again the gold turned to sand at his touch. He scooped and
    clawed and screamed, but the harder he grasped, the faster it all slipped
    away, until the chest held nothing but a heap of dust and the wind carried
    it off across the hills.

    A quiet shepherd who had followed them, hoping only to fill one small water
    pot, knelt at the empty chest. He reached in gently, with no greed at all,
    and lifted out a single coin to buy bread for his family. In his open palm
    it stayed bright and golden.

    The sages tell this tale to explain Krishna's warning. The chieftain had
    empty hopes, empty deeds, and empty knowledge, for he never understood the
    one true thing. He had chased a hollow prize with a fierce and grasping
    heart, and everything he reached for turned to nothing in his hands.

    The world is full of treasure, the sages say. But it gives itself only to
    the open heart, never to the clutching fist.

reflection: "The greedy chieftain's gold turned to sand, but the gentle shepherd's coin stayed bright. Why do you think holding on too tightly to something can sometimes make us lose it?"

illustration_brief: >
  Three zones side by side. Left: two men pat up sand mounds shaped like huts while white and green
  wave bands wash them flat. Centre: a plain village chieftain (brown skin, moustache, simple
  turban, no crown, no halo), no bigger than the other men, holds up cupped hands as gold turns to
  grey sand and runs out between his fingers. Right: two men quarrel facing each other with clear
  space between their bodies, each holding one club in one hand and pointing with the other, in
  front of a whirlwind drawn as three broad smooth black spiral bands on the red ground. Krishna
  (clear saturated blue skin, yellow silk, peacock-feather crown, golden halo, exactly two arms)
  stands small in the top right corner, fully visible and apart from everyone, watching sadly. Every
  figure has exactly two arms. Kerala mural idiom: rounded faces, lotus-petal eyes, heavy ornaments;
  flat colour with no shading; ochre-yellow, Indian red, deep green, white and black; creeper and
  lotus scrollwork in every gap; foliate scroll border on four sides. Exclude: small curls, hooks,
  dots or strokes inside the whirlwind; crowns or halos on anyone but Krishna; figures overlapping
  Krishna; coins; Arjuna; blue sky; text, letters, numerals, symbols, squiggles or script anywhere,
  including on fields, bands, mats and borders; extra arms or hands; a second Krishna.
