number: 9
slug: 09-raja-vidya-raja-guhya-yoga
name: The Yoga of the Royal Secret
sanskrit_name: राजविद्याराजगुह्ययोग
transliterated_name: Rāja Vidyā Rāja Guhya Yoga
verse_count: 34
folk_art_style: kerala-mural
summary: >
  Krishna shares the king of all secrets — the most wonderful knowledge there
  is. He says that he holds the entire universe like a thread holds together
  the beads of a necklace. Even a small offering made with true love — a leaf,
  a flower, a fruit, or just water — reaches him and makes him happy.
status: active
cover_brief: >
  At the centre Krishna (clear saturated blue skin, yellow silk, peacock-feather crown, golden halo,
  exactly two arms), the largest figure and the only Krishna, stands holding up in both hands one
  long golden thread strung with exactly six large round white beads, the clearest image in the
  picture; the thread passes through every bead. Inside each bead is one simple painted object, each
  different: a sun, a crescent moon, a mountain, a river, a cow, a tree. Below him a single row of
  four villagers, each with brown skin and exactly two arms, walks toward him offering a leaf, a
  flower, a fruit and a small clay pot of water. Arjuna (warm brown skin, black moustache,
  terracotta-red armour, a plain red cloth headband and no crown, no halo, Gandiva bow on his
  shoulder) kneels at the right with palms joined. The whole ground is filled with curling creepers
  and lotus scrollwork, inside a foliate scroll border on all four sides. Kerala mural idiom:
  rounded faces, lotus-petal eyes, heavy ornaments; flat colour with no shading; ochre-yellow,
  Indian red, deep green, white and black; creeper and lotus scrollwork in every gap; foliate scroll
  border on four sides. Exclude: a crown on Arjuna; more than six beads; repeated objects in the
  beads; roundels containing small Krishnas; tiny people inside the beads; any second Krishna or
  Arjuna; chariot or horses; planets with rings, galaxies, globes; blue sky; horizon; text, letters,
  numerals, symbols, squiggles or script anywhere, including on fields, bands, mats and borders;
  extra arms or hands; a second Krishna.
