number: 9
slug: 09-raja-vidya-raja-guhya-yoga
name: The Yoga of the Royal Secret
sanskrit_name: राजविद्याराजगुह्ययोग
transliterated_name: Rāja Vidyā Rāja Guhya Yoga
verse_count: 34
folk_art_style: warli
summary: >
  Krishna shares the king of all secrets — the most wonderful knowledge there
  is. He says that he holds the entire universe like a thread holds together
  the beads of a necklace. Even a small offering made with true love — a leaf,
  a flower, a fruit, or just water — reaches him and makes him happy.
status: active
cover_brief: >
  Krishna (largest figure, one Krishna only, exactly two arms, blue skin, yellow silk, peacock-feather
  crown, halo) stands at the centre holding up with both hands a long necklace thread strung with
  large round white pearls, and inside each pearl is a tiny white Warli picture: a sun, a crescent
  moon, a mountain, a river, a hut, a cow, a bird, a tree. Below, a row of white stick-figure
  villagers walk toward him offering a leaf, a flower, a fruit and a small pot of water; Arjuna (brown
  skin, black moustache, terracotta armour, plain headband, Gandiva on his shoulder) kneels at the
  right with folded hands. The entire background, including all four corners, is flat terracotta red-
  brown, covered with white Warli spirals, dots, trees and a white geometric border; every figure
  other than Krishna and Arjuna is drawn in white line only. Exclude: planets, rings around planets,
  galaxies, constellation lines, globes, stars in dotted patterns, a cream, beige or white background,
  brown or black stick figures; no text, letters, numbers or script.
