number: 16
slug: 16-daivasura-sampad-vibhaga-yoga
name: The Yoga of Divine and Demonic Qualities
sanskrit_name: दैवासुरसम्पद्विभागयोग
transliterated_name: Daivāsura Sampad Vibhāga Yoga
verse_count: 24
folk_art_style: madhubani
summary: >
  Krishna describes two kinds of qualities that live inside every person —
  divine ones and not-so-good ones. Divine qualities are things like courage,
  kindness, honesty, and generosity. The not-so-good ones include anger, pride,
  and cruelty. Krishna encourages us to grow our good qualities like a
  beautiful garden and to gently let go of the weeds.
status: active
cover_brief: >
  One Mithila village garden split down the middle by a flowering tree. Left half, bright with
  flowers: villagers show divine qualities, a man gives grain to a poor family, a boy bows
  respectfully to his elder, a woman shields a calf from a snarling dog. Right half, overgrown with
  thorny weeds: villagers show bad qualities kept mild, a man shouts angrily with a raised fist,
  another hugs a pile of gold coins, a proud man in fine clothes turns away a hungry beggar. Krishna
  (largest figure, one Krishna only, exactly two arms, blue skin, yellow silk, peacock-feather crown,
  halo) stands near the centre on the flower side, gently pulling a thorny weed out of the ground with
  both hands; Arjuna (appears once only, brown skin, black moustache, terracotta armour, plain
  headband, holding Gandiva) stands beside him watching. Classic Madhubani painting: every figure,
  garment, tree and animal drawn with double-line outlines filled with parallel hatching, faces in
  strict profile with large fish-shaped eyes, flat colour, the whole cream ground packed with fish,
  lotus, birds and vines leaving no empty space, inside a dense fish-and-lotus border. Exclude: four
  arms or conch or discus on Krishna, two warriors that look alike, motion lines or sparks around
  heads, balance scales, hand icons, symbols in circles or medallions, monster masks, fanged faces,
  snakes, soft storybook shading; no text, letters, numbers or script.
