meaning: >
  Krishna keeps showing Arjuna where to find him. Among the great serpents he
  is Ananta, the endless one who never comes to a stop. Among the deities of
  water he is Varuna, who rules the seas and rivers. Among the ancestors he is
  Aryaman, the eldest and noblest, and among all who keep order and justice he
  is Yama, the steady lord of the law. Wherever something holds, guards, or
  endures, that strength is a spark of him.

story:
  title: "The Serpent Without End"
  source: "puranas"
  body: |
    Before the sun, before the mountains, before even the first morning,
    there was a dark and shoreless ocean. Nothing moved upon it. No bird
    crossed it, no wind ruffled it. It stretched on and on, with no edge
    anywhere.

    And floating on that ocean was a serpent.

    He was no ordinary snake. His name was Ananta, which means "the one with
    no end," and the name fit him perfectly. If you tried to follow his coils
    you would never reach his tail. If you counted his hoods you would lose
    count, for there were a thousand of them, spread wide like a great glowing
    canopy. Each hood shimmered with its own jewel, so that the whole serpent
    glittered like a sky full of stars laid out flat upon the water.

    On the soft, shining coils of Ananta lay the god Vishnu, fast asleep,
    resting between the making of one world and the next. The serpent did not
    mind the weight. He held the sleeping god the way a calm lake holds the
    moon — easily, without strain, as if it were nothing at all.

    And it was not only Vishnu that Ananta carried. Far above, balanced on his
    countless hoods, rested the whole round earth, with all its mountains and
    forests and oceans and the creatures yet to be born. When the earth grew
    heavy, Ananta only shifted a little, and people far below felt the ground
    tremble. But he never let go. He never tired. He had been holding the
    worlds since before time began, and he would hold them long after.

    "Among all the serpents," Krishna told Arjuna on the battlefield, "I am
    Ananta — the endless one. Whatever upholds and never gives way, whatever
    has no beginning and no end, that is My splendour."

    Arjuna thought of the great snake holding up the whole earth without
    complaint, and he understood. Some things in the world hold steady so that
    everything else can rest. The one who never lets go, who endures past every
    ending. There, Krishna shines.

reflection: "Who or what in your life holds steady so that you can feel safe — someone who is always there, who never lets go?"
illustration_brief: >
  Four zones inside one complete, unbroken scrolling vine border that runs around all four sides.
  Left: Ananta, a vast coiled serpent with many spread hoods like a canopy, floating alone on a
  dark endless ocean, with no one on it. Top centre: Varuna, lord of the waters, crowned, drawn in
  side profile riding a makara through blue waves, a simple human with two arms only: one hand
  lifts a looped noose and the other hand rests flat on the makara's head. Top right: Aryaman,
  chief of the ancestors, a noble crowned elder with a white beard, two arms only, both open palms
  lowered in blessing, seated on a lotus seat in soft clouds above a family who kneel at a
  riverbank offering rice balls and water. Bottom right: Yama, lord of justice, dark-skinned,
  crowned, with moustache, drawn in side profile riding one black buffalo, a simple human with two
  arms only: one hand holds a tall staff and the other hand rests flat on the buffalo's back; he
  holds nothing else. Krishna (deep blue skin, yellow silk, peacock-feather crown, halo, exactly
  two arms) stands small at the bottom centre, fully inside the border, pointing; one Krishna
  only. Exclude: four-armed or many-armed gods; any third hand; lotus, conch or discus held by any
  god; gaps or breaks in the border; any god drawn twice; archers, bows, warriors or fire altars;
  Arjuna; Vishnu reclining on the serpent; no text, letters or script.
