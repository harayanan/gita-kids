chapter: 10
verse: 29
speaker: krishna

sanskrit: "अनन्तश्चास्मि नागानां वरुणो यादसामहम्। पितॄणामर्यमा चास्मि यमः संयमतामहम्॥"

transliteration: "anantaścāsmi nāgānāṁ varuṇo yādasāmaham | pitṝṇāmaryamā cāsmi yamaḥ saṁyamatāmaham ||"

