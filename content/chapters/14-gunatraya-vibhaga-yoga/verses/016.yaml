    parts: ["tu (but, however)"]
    meaning: "but, however"
  - word: "दुःखम्"
    parts: ["duḥ (bad, hard)", "kha (space, axle-hole, feeling)"]
    meaning: "pain, sorrow, a wobbling, uneasy feeling"
