number: 14
slug: 14-gunatraya-vibhaga-yoga
name: The Yoga of the Three Qualities
sanskrit_name: गुणत्रयविभागयोग
transliterated_name: Gunatraya Vibhāga Yoga
verse_count: 27
folk_art_style: kerala-mural
summary: >
  Krishna explains that everything in nature is made of three qualities, like
  three colors mixing together. Sattva is calm and bright like sunshine. Rajas
  is restless and energetic like a storm. Tamas is heavy and sleepy like a
  dark cloud. The goal is to rise above all three and become truly free.
status: active
cover_brief: >
  Three thick ropes, one white, one Indian red and one black, wind across the whole picture from
  edge to edge; they are the clearest element and each rope's ends are tied to wooden stakes at the
  left and right borders. Three zones sit along the ropes. Left, in white and gold light under a
  steady oil lamp: four villagers sit upright in a circle sharing food from one basket. Centre, in
  Indian red: three merchants hurry in a line, each carrying one sack on his shoulder with both
  hands. Right, in black shade: three people sit slumped with drooping heads beside tipped clay
  pots. Every figure has exactly two arms, and every hand belongs to a visible body. At the top
  centre Krishna (clear saturated blue skin, yellow silk, peacock-feather crown, golden halo,
  exactly two arms), the largest figure, stands on a white lotus above the ropes, both hands holding
  a flute at his lips, touching no rope; Arjuna (warm brown skin, black moustache, terracotta-red
  armour, plain headband, Gandiva bow on his shoulder) stands smaller beside him with folded hands.
  Kerala mural idiom: rounded faces, lotus-petal eyes, heavy ornaments; flat colour with no shading;
  ochre-yellow, Indian red, deep green, white and black; creeper and lotus scrollwork in every gap;
  foliate scroll border on four sides. Exclude: fighting or grappling figures, hands or arms without
  a body, people lying flat, sleep marks, roundels containing small Krishnas, any second Krishna or
  Arjuna, chariot or horses, blue sky, horizon; no text, letters, numerals or script anywhere; extra
  arms or hands; a second Krishna.
