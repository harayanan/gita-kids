number: 14
slug: 14-gunatraya-vibhaga-yoga
name: The Yoga of the Three Qualities
sanskrit_name: गुणत्रयविभागयोग
transliterated_name: Gunatraya Vibhāga Yoga
verse_count: 27
folk_art_style: warli
summary: >
  Krishna explains that everything in nature is made of three qualities, like
  three colors mixing together. Sattva is calm and bright like sunshine. Rajas
  is restless and energetic like a storm. Tamas is heavy and sleepy like a
  dark cloud. The goal is to rise above all three and become truly free.
status: active
cover_brief: >
  Three side-by-side zones of white Warli stick figures on one flat terracotta red-brown ground that
  covers the whole picture, including the corners. Left, under a bright white sun, villagers sit
  upright with folded hands and share food from a basket in a circle; centre, under a white storm
  cloud with zigzag lightning, stick figures run, argue with raised arms and grab at baskets; right,
  under a heavy dark grey cloud, idle stick figures sit slumped against a hut with drooping heads and
  do nothing while their pots lie tipped over and a black buffalo wallows in mud beside them. Three
  thick rope strands, one white, one red and one black, wind across all three zones; at the top centre
  Krishna (largest figure, one Krishna only, exactly two arms and two hands, both hands holding a
  flute, blue skin, yellow silk, peacock-feather crown, halo) stands on a white lotus above and free
  of the ropes, and Arjuna (brown skin, black moustache, terracotta armour, plain headband, holding
  Gandiva) stands smaller beside him watching. Every other figure, tree, hut and animal is drawn in
  white line only, with a white geometric chain border. The sky between the clouds holds only small
  white dots and spirals. Exclude: people lying down, the letter Z or any Z-shaped marks, snoring
  marks, motion lines, sparks or exclamation marks, four arms on Krishna, a cream or white background,
  painted secondary figures; no text, letters, numbers or script.
