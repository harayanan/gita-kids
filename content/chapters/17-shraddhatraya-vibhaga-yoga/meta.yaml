number: 17
slug: 17-shraddhatraya-vibhaga-yoga
name: The Yoga of the Three Kinds of Faith
sanskrit_name: श्रद्धात्रयविभागयोग
transliterated_name: Shraddhātraya Vibhāga Yoga
verse_count: 28
folk_art_style: pichwai
summary: >
  Krishna teaches that everyone has faith in something — it's what drives us.
  Just like the three qualities from before, faith also comes in three types.
  The best kind of faith is bright and pure — it leads us to eat well, be
  generous, and live with discipline. Krishna shows how our choices in food,
  giving, and self-control reveal what kind of faith lives in our hearts.
status: active
cover_brief: >
  Krishna (largest figure, one Krishna only, exactly two arms, blue skin, yellow silk,
  peacock-feather crown, halo) stands at the centre on a lotus playing the flute, with Arjuna (brown
  skin, black moustache, terracotta armour, plain headband, holding Gandiva) standing at the right
  with folded hands. Around them, three kinds of offering on a flat navy Pichwai ground. Upper left:
  a humble family with gentle faces offers fresh fruit, milk and grain at a clean fire altar and
  gives a meal to a hungry traveller. Upper right: a proud king covered in jewels pours a heap of
  gold before a crowd of applauding courtiers while looking around for praise. Lower band: two lazy
  men sit slumped and yawning beside a plate of stale leftover food, tossing a careless offering.
  Gold textile border with a lotus chain; lotus clusters, banana leaves and peacocks fill the gaps.
  Exclude: wrapped gift boxes, ribbons, bows on packages, people sitting on or riding cows, figures
  surrounded by flames, grey ghostly figures, coins on balance scales; no text, letters, numbers or
  script.
