slug: 18-moksha-sannyasa-yoga
name: The Yoga of Liberation
sanskrit_name: मोक्षसंन्यासयोग
transliterated_name: Moksha Sannyāsa Yoga
verse_count: 78
folk_art_style: pattachitra
summary: >
  This is the grand finale! Krishna brings all his teachings together like the
  last chapter of an amazing book. He reminds Arjuna about duty, devotion,
  and knowledge. Then he says the most beautiful words — "I love you dearly,
  so I have shared this deepest wisdom with you. Now think about it carefully
  and do what your heart tells you." Arjuna's doubts vanish, and he picks up
  his bow, ready to face whatever comes.
status: active
cover_brief: >
  On the Kurukshetra battlefield at sunrise, a golden chariot drawn by four white horses fills the
  centre, with a Hanuman banner flying above it. Krishna (largest and tallest figure, one Krishna
  only, exactly two arms, blue skin, yellow silk, peacock-feather crown, halo) stands on the front of
  the chariot, his face turned back toward Arjuna with a loving smile, and both of his hands hold the
  reins together at his waist; he has no raised hand and no other hand. Arjuna (appears once only,
  smaller than Krishna, brown skin, black moustache, terracotta armour, plain headband) stands in the
  chariot behind him, holding the Gandiva bow upright in his left hand with no arrow on the string and
  his right hand on his heart, his face calm and ready. Rows of Pandava soldiers with spears,
  elephants with caparisons and pennants wait on both sides, some blowing white spiral conch shells,
  on a Pattachitra field with bold black outlines, the whole ground covered in small flowers, cross-
  hatched earth and floral scrolls with no bare areas, inside a nested navy, green and rust border.
  Exclude: a third hand, raised palm or pointing finger on Krishna, an arrow pointed toward Krishna, a
  second Arjuna, horns or rolled scrolls instead of conches, saffron, white and green bands, swooshes,
  medallions, Om glyphs, gardens or cows; no text, letters, numbers or script.
