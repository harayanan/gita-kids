number: 4
slug: 04-jnana-karma-sannyasa-yoga
name: The Yoga of Knowledge and Action
sanskrit_name: ज्ञानकर्मसंन्यासयोग
transliterated_name: Jnāna Karma Sannyāsa Yoga
verse_count: 42
folk_art_style: kerala-mural
summary: >
  Krishna shares a wonderful secret — he has taught this wisdom many times
  before, across many ages, whenever the world needs help. He explains that
  true knowledge is like a fire that burns away all doubts and confusion. When
  you combine learning with doing good, you become truly free.
status: active
cover_brief: >
  At the centre a large fire altar burns with one tall, steady golden flame, the fire of knowledge,
  the clearest image in the picture; dry sticks tied with knotted threads lie in the flame and turn to
  gold sparks. Krishna (largest figure, one Krishna only, exactly two arms, clear saturated blue skin,
  yellow silk, peacock-feather crown, golden halo) stands at the left of the altar and holds out one
  small lit oil lamp in both hands. Arjuna (appears once only, warm brown skin, black moustache,
  terracotta-red armour, plain headband, Gandiva bow on his shoulder) kneels at the right with cupped
  hands raised to receive the lamp. Behind Krishna a line of three crowned royal sages each holds a
  lit lamp, the ancient chain of teachers. The whole ground is filled with curling creepers and lotus
  scrollwork in ochre, Indian red, deep green, white and black, inside a foliate scroll border on all
  four sides. Exclude: roundels or medallions containing small Krishnas, any second Krishna or Arjuna,
  chariot or horses, smoke clouds, blue sky, landscape horizon, temples, any third hand; no text,
  letters, numbers or script.
