number: 8
slug: 08-akshara-brahma-yoga
name: The Yoga of the Eternal Spirit
sanskrit_name: अक्षरब्रह्मयोग
transliterated_name: Akshara Brahma Yoga
verse_count: 28
folk_art_style: pattachitra
summary: >
  Arjuna asks big questions about life, death, and what happens after we leave
  this world. Krishna explains that whatever we think about at the very end
  of our life is where our heart truly goes. So if we practice remembering
  goodness and love every day, we carry that light with us always.
status: active
cover_brief: >
  In a forest hermitage at dawn, an old rishi (white beard, matted hair bun, rudraksha beads, fully
  clothed in an ochre dhoti and shawl) lies peacefully on a grass mat with a calm smile and folded
  hands, a small clay lamp burning steadily beside his head, and a single thin golden ray of light
  rises from his heart up to a radiant sun at the top centre of the picture. Krishna (largest figure,
  one Krishna only, exactly two arms, blue skin, yellow silk, peacock-feather crown, halo) stands at
  the left pointing up to the rising light; Arjuna (no halo, brown skin, black moustache, terracotta
  armour, plain headband, holding Gandiva) stands at the right with one palm open in a question. Fully
  clothed family members kneel beside the rishi with folded hands. Flat Pattachitra composition with
  no depth: a flat cream field covered in fine floral scrolls and cross-hatching, stylised flat trees
  and lotus vines, lamps and temple pillars at the sides, bold black outlines, all inside a nested
  navy, green and rust border. Exclude: rolling hills, horizon line, receding green lawn, distant
  buildings, perspective landscape, a halo on Arjuna, nudity, any person inside or above flames, small
  deity figures in medallions, a second blue-skinned figure, tears or distress; no text, letters,
  numbers or script.
